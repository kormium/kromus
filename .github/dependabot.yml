version: 2
updates:
  # Gradle dependencies are declared in gradle/libs.versions.toml; Dependabot edits the catalog.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: "/gradle/wrapper"
    schedule:
      interval: monthly
