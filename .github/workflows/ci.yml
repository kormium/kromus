name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast job: it runs on every push and is what a contributor waits on. Ubuntu covers JVM,
  # Android, JS, Wasm and linuxX64 — everything except the Apple targets — and is quicker and
  # cheaper than the macOS runner.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Benchmarks smoke run
        # Keeps the benchmark suite compiling and running; the full sweep is far too slow for CI.
        run: ./gradlew :benchmarks:run --args="--quick" --stacktrace

  # The complete matrix, including the Apple targets and the klib ABI check that only holds up on a
  # host able to build every declared target. This is also where releases are cut from.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
