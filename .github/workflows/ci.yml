name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast job: it runs on every push and is what a contributor waits on. Ubuntu covers JVM,
  # Android, JS, Wasm and linuxX64 — everything except the Apple targets — and is quicker and
  # cheaper than the macOS runner.
  linux:
    runs-on: ubuntu-latest
    # The platform default is six hours, which is how long a runaway benchmark once held a runner
    # before anything noticed. These jobs take minutes; anything near the cap is a bug, not a slow day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Benchmarks smoke run
        # Keeps the benchmark suite compiling and running; the full sweep is far too slow for CI.
        run: ./gradlew :benchmarks:run --args="--quick" --stacktrace

  # The complete matrix, including the Apple targets and the klib ABI check that only holds up on a
  # host able to build every declared target. This is also where releases are cut from.
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --stacktrace

  # The ONNX Runtime C bindings are opt-in and bind nothing by default, so nothing else in this
  # workflow touches them — which is how they stayed unverified. This job downloads a real ORT release
  # and drives the generated bindings against it. Linux only: the .def is the same everywhere, and the
  # part that can break (the struct of function pointers behind OrtGetApiBase) is exercised here for a
  # fraction of a macOS runner's cost.
  onnx-c-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch the ONNX Runtime the version catalog pins
        # Taken from libs.versions.toml rather than pinned here, so the C bindings are always checked
        # against the same release the JVM backend depends on.
        run: |
          version="$(sed -n 's/^onnxruntime = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          echo "Using ONNX Runtime $version"
          curl -sSfL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-linux-x64-$version.tgz"
          tar xzf ort.tgz
          echo "ORT_ROOT=$PWD/onnxruntime-linux-x64-$version" >> "$GITHUB_ENV"
      - name: Build and run the interop test
        run: ./gradlew :kromus-onnx:linuxX64Test -Pkromus.onnxCApi="$ORT_ROOT" --stacktrace
