# Single source of truth for third-party versions. The Kotlin and Android plugins are resolved in the
# root buildscript block (the modules apply them without a version), so they live here too and are
# read from there rather than being repeated per module.

[versions]
kotlin = "2.4.10"
android-gradle-plugin = "9.2.1"
coroutines = "1.11.0"
kemus = "0.3.0"
onnxruntime = "1.29.0"
vanniktech-publish = "0.36.0"
binary-compatibility-validator = "0.18.1"
foojay-resolver = "0.9.0"
dokka = "2.2.0"
ktlintGradle = "14.2.0"
ktlint = "1.5.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kemus-core = { module = "io.github.kormium:kemus-core", version.ref = "kemus" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

[plugins]
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
